<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlus — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <header>
    <nav class="navbar">
      <h1 class="logo">EduPlus</h1>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="login.html">Kursevi</a></li>
        <li><a href="contact.html">Kontakt</a></li>
      </ul>
    </nav>
  </header>

 
  <main class="container">
    <section class="hero">
      <h2>Prijava na EduPlus</h2>
      <form id="loginForm" class="login-form">
        <label for="email">Email adresa:</label>
        <input type="email" id="email" placeholder="Unesite email" required>

        <label for="password">Lozinka:</label>
        <input type="password" id="password" placeholder="Unesite lozinku" required>

        <button type="submit" class="btn">Uloguj se</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> EduPlus — Online Kursevi</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
