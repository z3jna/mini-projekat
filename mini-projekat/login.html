<!DOCTYPE html> 
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlus — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <h1 class="logo">EduPlus</h1>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="login.html">Kursevi</a></li>
        <li><a href="contact.html">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Prijava na EduPlus</h2>

      
      <form action="auth.php" method="get" class="login-form">
        <label for="email">Email adresa:</label>
        <input type="email" id="email" name="email" placeholder="Unesite email" required>

        <label for="password">Lozinka:</label>
        <input type="password" id="password" name="password" placeholder="Unesite lozinku" required>

        <button type="submit" class="btn">Uloguj se</button>
      </form>

      <hr style="margin: 2rem 0; opacity: 0.3;">

      
      <h2>Registracija</h2>
      <form action="auth.php" method="post" class="login-form">

        <label>Ime i prezime:</label>
        <input type="text" name="ime" placeholder="Unesite ime" required>

        <label>Indeks (broj):</label>
        <input type="text" name="indeks" placeholder="Unesite indeks" required>

        <label>Godine (broj):</label>
        <input type="text" name="godine" placeholder="Unesite godine" required>

        <button type="submit" class="btn">Registruj se</button>
      </form>

    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> EduPlus — Online Kursevi</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
